name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android App & Print Key Fingerprint
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "=== KODE SHA1 APK DEBUG DARI GITHUB ACTIONS ==="
          keytool -list -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep "SHA1:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
